[package]
name = "database"
version = "1.0.0-rc.1"
author = "HHY Official"
requires_hhy = ">=1.4.4,<2.0"

[extension]
kind = "process"
command = "bin/hhy-database"
protocol = "1"

[capabilities]
read = ["explicit-ca-files"]
write = []
network = ["explicit-data-source-endpoints", "loopback-database-urls"]
process = false
