name: HHY release evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-baseline:
    name: Quality, documentation, and performance baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev libpcre2-dev libgc-dev \
            libjansson-dev libssl-dev

      - name: Install editor packaging dependencies
        run: npm ci --prefix editors/vscode

      - name: Run quality gates and benchmark
        run: |
          make quality
          make benchmark-bytecode

      - name: Build VS Code extension
        run: |
          npm run prepare:dist --prefix editors
          npm run package:vscode --prefix editors

      - name: Upload performance baseline
        uses: actions/upload-artifact@v7
        with:
          name: hhy-performance-baseline-${{ github.sha }}
          path: build/benchmarks/baseline.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload VS Code extension
        uses: actions/upload-artifact@v7
        with:
          name: hhy-vscode-extension-${{ github.sha }}
          path: editors/dist/hhy-language-support-0.2.0.vsix
          if-no-files-found: error
          retention-days: 30

  windows-msys2:
    name: Windows x86_64 MSYS2 build and smoke
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MSYS2 build environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel
            gcc
            libcurl-devel
            libgc-devel
            pcre2-devel
            jansson-devel
            openssl-devel
            cmake

      - name: Build HHY on Windows
        run: make clean && make

      - name: Windows parser and runtime smoke
        run: |
          ./build/hhy --version
          ./build/hhy check examples/*.hhy tests/valid/basic.hhy tests/valid/regex.hhy tests/valid/json-flow.hhy
          ./build/hhy bytecode examples/00-hello.hhy | grep 'HALT'
          make bytecode-test
          ./build/hhy run tests/valid/basic.hhy
          ./build/hhy run --engine bytecode tests/valid/basic.hhy
          ./build/hhy run tests/valid/regex.hhy
          ./build/hhy run --engine bytecode tests/valid/regex.hhy
          ./build/hhy run tests/valid/json-flow.hhy
          ./build/hhy run --engine bytecode tests/valid/json-flow.hhy

      - name: Build Windows official extension targets
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/lexbor/lexbor/archive/refs/tags/v3.0.0.tar.gz \
            --output /tmp/lexbor-v3.0.0.tar.gz
          tar -xzf /tmp/lexbor-v3.0.0.tar.gz -C /tmp
          cmake -S /tmp/lexbor-3.0.0 -B /tmp/lexbor-build \
            -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/lexbor-build --parallel 2
          cmake --install /tmp/lexbor-build
          make -C extensions/sample
          make -C extensions/html LEXBOR_PREFIX=/usr/local
          make -C extensions/html LEXBOR_PREFIX=/usr/local test
          mkdir -p extensions/html/lib
          for executable in extensions/html/bin/*; do
            ldd "$executable" | awk '/=> \/|^\// { for (i = 1; i <= NF; i++) if ($i ~ /^\//) print $i }' | while IFS= read -r dependency; do
              cp -L "$dependency" "extensions/html/lib/$(basename "$dependency")"
            done
          done
          extension_home=/tmp/hhy-html-extension-home
          HHY_EXTENSION_HOME="$extension_home" ./build/hhy install --yes extensions/html
          HHY_EXTENSION_HOME="$extension_home" ./build/hhy run tests/valid/extension-html-catalog.hhy | grep 'HTML Extension'
          mkdir -p build/registry-target/extensions/sample build/registry-target/extensions/html
          cp -R extensions/sample/hhy.toml extensions/sample/bin build/registry-target/extensions/sample/
          cp -R extensions/html/hhy.toml extensions/html/bin extensions/html/lib build/registry-target/extensions/html/
          for executable in build/registry-target/extensions/*/bin/*; do
            ldd "$executable" | awk '/=> \/|^\// { for (i = 1; i <= NF; i++) if ($i ~ /^\//) print $i }' | while IFS= read -r dependency; do
              mkdir -p "$(dirname "$(dirname "$executable")")/lib"
              cp -L "$dependency" "$(dirname "$(dirname "$executable")")/lib/$(basename "$dependency")"
            done
          done

      - name: Upload Windows extension target
        uses: actions/upload-artifact@v7
        with:
          name: hhy-registry-windows-x86_64-${{ github.sha }}
          path: build/registry-target/extensions
          if-no-files-found: error
          retention-days: 14

      - name: Build Windows MSYS2 release archive
        run: sh scripts/build-windows-release.sh

      - name: Verify Windows archive and required notices
        run: |
          (cd dist && sha256sum --check *.sha256)
          tar -tzf dist/*.tar.gz | grep -E 'bin/hhy.exe$'
          tar -tzf dist/*.tar.gz | grep -E 'BUILD_INFO.txt$'
          tar -tzf dist/*.tar.gz | grep -E 'LICENSE$'
          tar -tzf dist/*.tar.gz | grep -E 'NOTICE$'
          tar -tzf dist/*.tar.gz | grep -E 'docs/KNOWN_LIMITATIONS.md$'
          tar -tzf dist/*.tar.gz | grep -E 'docs/BYTECODE.md$'

      - name: Upload Windows release evidence
        uses: actions/upload-artifact@v7
        with:
          name: hhy-windows-x86_64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.package_arch }} native sanitizer and release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            uname_arch: x86_64
            package_arch: x86_64
            sanitizers: undefined
          - runner: ubuntu-24.04-arm
            uname_arch: aarch64
            package_arch: arm64
            sanitizers: address,undefined
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert native architecture
        run: test "$(uname -m)" = "${{ matrix.uname_arch }}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libcurl4-openssl-dev libpcre2-dev libgc-dev \
            libjansson-dev libssl-dev libpq-dev default-libmysqlclient-dev cmake patchelf

      - name: Build pinned Linux HTML dependency
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/lexbor/lexbor/archive/refs/tags/v3.0.0.tar.gz \
            --output /tmp/lexbor-v3.0.0.tar.gz
          tar -xzf /tmp/lexbor-v3.0.0.tar.gz -C /tmp
          cmake -S /tmp/lexbor-3.0.0 -B /tmp/lexbor-build \
            -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_TESTS=OFF
          cmake --build /tmp/lexbor-build --parallel 2
          sudo cmake --install /tmp/lexbor-build
          sudo ldconfig

      - name: Debug sanitizer suite
        run: make test-debug SANITIZERS=${{ matrix.sanitizers }}

      - name: Release suite
        run: make clean && make test && make test-bytecode && make workload-test

      - name: Coverage-guided fuzzing
        run: make fuzz-ci FUZZ_CC=clang

      - name: Build checksummed archive
        run: make dist

      - name: Verify archive and required notices
        run: |
          (cd dist && sha256sum --check *.sha256)
          tar -tzf dist/*.tar.gz | grep -E 'BUILD_INFO.txt$'
          tar -tzf dist/*.tar.gz | grep -E 'LICENSE$'
          tar -tzf dist/*.tar.gz | grep -E 'NOTICE$'
          tar -tzf dist/*.tar.gz | grep -E 'docs/HHY_V1.md$'
          tar -tzf dist/*.tar.gz | grep -E 'docs/THIRD_PARTY_NOTICES.md$'
          tar -tzf dist/*.tar.gz | grep -E 'docs/KNOWN_LIMITATIONS.md$'

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: hhy-linux-${{ matrix.package_arch }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux extension target
        uses: actions/upload-artifact@v7
        with:
          name: hhy-registry-linux-${{ matrix.package_arch }}-${{ github.sha }}
          path: build/hhy-*/extensions
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS arm64 native sanitizer and release
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert native arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Install build dependencies
        run: brew install pcre2 bdw-gc jansson openssl@3 libpq mysql lexbor

      - name: Debug ASan and UBSan suite
        run: make test-debug

      - name: Release suite
        run: make clean && make test && make test-bytecode && make workload-test

      - name: Deterministic fuzz smoke
        run: make fuzz-smoke

      - name: Build checksummed archive
        run: make dist

      - name: Verify archive and required notices
        run: |
          (cd dist && shasum -a 256 -c *.sha256)
          tar -tzf dist/*.tar.gz | grep -E 'BUILD_INFO.txt$'
          tar -tzf dist/*.tar.gz | grep -E 'LICENSE$'
          tar -tzf dist/*.tar.gz | grep -E 'NOTICE$'
          tar -tzf dist/*.tar.gz | grep -E 'docs/HHY_V1.md$'
          tar -tzf dist/*.tar.gz | grep -E 'docs/THIRD_PARTY_NOTICES.md$'
          tar -tzf dist/*.tar.gz | grep -E 'docs/KNOWN_LIMITATIONS.md$'

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: hhy-darwin-arm64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS extension target
        uses: actions/upload-artifact@v7
        with:
          name: hhy-registry-darwin-arm64-${{ github.sha }}
          path: build/hhy-*/extensions
          if-no-files-found: error
          retention-days: 14

  practical-projects:
    name: Practical projects acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev libpcre2-dev libgc-dev \
            libjansson-dev libssl-dev libpq-dev default-libmysqlclient-dev cmake

      - name: Build pinned HTML dependency
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/lexbor/lexbor/archive/refs/tags/v3.0.0.tar.gz \
            --output /tmp/lexbor-v3.0.0.tar.gz
          tar -xzf /tmp/lexbor-v3.0.0.tar.gz -C /tmp
          cmake -S /tmp/lexbor-3.0.0 -B /tmp/lexbor-build \
            -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_TESTS=OFF
          cmake --build /tmp/lexbor-build --parallel 2
          sudo cmake --install /tmp/lexbor-build
          sudo ldconfig

      - name: Build HHY and extensions
        run: make all extensions

      - name: Install browser fixture runtime
        run: |
          npm ci --prefix practical-projects/my-crawler/renderer
          npm exec --prefix practical-projects/my-crawler/renderer -- playwright install --with-deps chromium

      - name: Run project acceptance
        run: |
          ./practical-projects/my-crawler/self-test.sh
          ./practical-projects/sitegraph-auditor/self-test.sh
