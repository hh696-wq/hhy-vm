name: Publish HHY release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic release tag (must match VERSION)"
        required: true
        default: "v1.2.2"

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            package: darwin-arm64
            uname_arch: arm64
          - runner: ubuntu-24.04
            package: linux-x86_64
            uname_arch: x86_64
          - runner: ubuntu-24.04-arm
            package: linux-arm64
            uname_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Verify tag and architecture
        shell: bash
        run: |
          test "${RELEASE_TAG}" = "v$(cat VERSION)"
          test "$(uname -m)" = "${{ matrix.uname_arch }}"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pcre2 bdw-gc jansson openssl@3 libpq mysql lexbor

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libcurl4-openssl-dev libpcre2-dev libgc-dev \
            libjansson-dev libssl-dev libpq-dev default-libmysqlclient-dev cmake patchelf

      - name: Build pinned Linux HTML dependency
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/lexbor/lexbor/archive/refs/tags/v3.0.0.tar.gz \
            --output /tmp/lexbor-v3.0.0.tar.gz
          tar -xzf /tmp/lexbor-v3.0.0.tar.gz -C /tmp
          cmake -S /tmp/lexbor-3.0.0 -B /tmp/lexbor-build \
            -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_TESTS=OFF
          cmake --build /tmp/lexbor-build --parallel 2
          sudo cmake --install /tmp/lexbor-build
          sudo ldconfig

      - name: Test release source
        run: |
          python3 tests/check_contracts.py
          make test
          sh tests/check-docs.sh build/hhy docs/HHY_V1.md
          sh tests/check-docs.sh build/hhy README.md

      - name: Build relocatable archive
        run: make dist

      - name: Verify archive from a clean directory
        shell: bash
        run: |
          archive=$(find dist -maxdepth 1 -type f -name '*.tar.gz')
          checksum=$(find dist -maxdepth 1 -type f -name '*.sha256')
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum --check "$(basename "$checksum")")
          else
            (cd dist && shasum -a 256 -c "$(basename "$checksum")")
          fi
          verify_dir=$(mktemp -d)
          tar -xzf "$archive" -C "$verify_dir"
          "$verify_dir"/hhy-*/bin/hhy --version
          "$verify_dir"/hhy-*/bin/hhy check "$verify_dir"/hhy-*/examples/01-log-errors.hhy
          extension_home="$verify_dir/extensions-home"
          HHY_EXTENSION_HOME="$extension_home" "$verify_dir"/hhy-*/bin/hhy install --yes \
            "$verify_dir"/hhy-*/extensions/sample
          HHY_EXTENSION_HOME="$extension_home" "$verify_dir"/hhy-*/bin/hhy install --yes \
            "$verify_dir"/hhy-*/extensions/html
          HHY_EXTENSION_HOME="$extension_home" "$verify_dir"/hhy-*/bin/hhy list | grep 'sample 0.1.0'
          HHY_EXTENSION_HOME="$extension_home" "$verify_dir"/hhy-*/bin/hhy list | grep 'html 0.2.0'

      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: hhy-${{ matrix.package }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build windows-x86_64
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Install MSYS2 build environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel
            gcc
            libcurl-devel
            libgc-devel
            pcre2-devel
            jansson-devel
            openssl-devel
            cmake

      - name: Verify tag
        run: test "${RELEASE_TAG}" = "v$(cat VERSION)"

      - name: Build and smoke-test release source
        run: |
          make clean && make
          ./build/hhy --version
          ./build/hhy check examples/*.hhy tests/valid/basic.hhy tests/valid/regex.hhy tests/valid/json-flow.hhy
          ./build/hhy run tests/valid/basic.hhy
          ./build/hhy run tests/valid/regex.hhy
          ./build/hhy run tests/valid/json-flow.hhy

      - name: Build Windows official extension targets
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/lexbor/lexbor/archive/refs/tags/v3.0.0.tar.gz \
            --output /tmp/lexbor-v3.0.0.tar.gz
          tar -xzf /tmp/lexbor-v3.0.0.tar.gz -C /tmp
          cmake -S /tmp/lexbor-3.0.0 -B /tmp/lexbor-build \
            -DCMAKE_BUILD_TYPE=Release -DLEXBOR_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/lexbor-build --parallel 2
          cmake --install /tmp/lexbor-build
          make -C extensions/sample
          make -C extensions/html LEXBOR_PREFIX=/usr/local
          make -C extensions/html LEXBOR_PREFIX=/usr/local test
          mkdir -p extensions/html/lib
          for executable in extensions/html/bin/*; do
            ldd "$executable" | awk '/=> \/|^\// { for (i = 1; i <= NF; i++) if ($i ~ /^\//) print $i }' | while IFS= read -r dependency; do
              cp -L "$dependency" "extensions/html/lib/$(basename "$dependency")"
            done
          done
          extension_home=/tmp/hhy-html-extension-home
          HHY_EXTENSION_HOME="$extension_home" ./build/hhy install --yes extensions/html
          HHY_EXTENSION_HOME="$extension_home" ./build/hhy run tests/valid/extension-html-catalog.hhy | grep 'HTML Extension'

      - name: Build and verify Windows archive
        run: |
          sh scripts/build-windows-release.sh
          (cd dist && sha256sum --check *.sha256)
          tar -tzf dist/*.tar.gz | grep -E 'bin/hhy.exe$'
          tar -tzf dist/*.tar.gz | grep -E 'extensions/sample/bin/hhy-sample.exe$'
          tar -tzf dist/*.tar.gz | grep -E 'extensions/html/bin/hhy-html.exe$'
          tar -tzf dist/*.tar.gz | grep -E 'BUILD_INFO.txt$'
          tar -tzf dist/*.tar.gz | grep -E 'LICENSE$'
          tar -tzf dist/*.tar.gz | grep -E 'NOTICE$'

      - name: Attest Windows release archive
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: hhy-windows-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Download verified assets
        uses: actions/download-artifact@v8
        with:
          pattern: hhy-*
          path: release-assets
          merge-multiple: true

      - name: Create combined checksum manifest
        working-directory: release-assets
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update release with every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag_option="--verify-tag"
          else
            tag_option="--target $GITHUB_SHA"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "HHY Language $version" \
              --notes-file "docs/releases/v$version.md"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              $tag_option \
              --draft \
              --title "HHY Language $version" \
              --notes-file "docs/releases/v$version.md"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
